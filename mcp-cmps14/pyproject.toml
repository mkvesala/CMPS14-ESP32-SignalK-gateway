[project]
name = "cmps14-mcp"
version = "0.1.0"
description = "MCP tool for the CMPS14-ESP32-SignalK gateway: read status, read/write the 8 deviation points, read the 360-entry deviation table."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
]

[project.scripts]
cmps14-mcp = "cmps14_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cmps14_mcp"]
